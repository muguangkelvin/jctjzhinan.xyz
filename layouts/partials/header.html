{{ $seo := .Site.Data.site_seo_profile }}
<header class="site-header">
  <div class="header-top-bar">
    <div class="header-container">
      <div class="brand-area">
        <a href="/" class="brand-logo" title="{{ .Site.Title }}">
          <span class="logo-badge">JC</span>
          <span class="brand-name">{{ .Site.Title }}</span>
        </a>
        <span class="brand-subtitle">机场推荐、Clash 机场测评与节点选择指南</span>
      </div>
      <div class="header-actions">
        <a href="/recommendations/" class="btn btn-header-cta">查看机场推荐</a>
        
        <!-- Search Box with Search Icon & Associated Keywords Dropdown -->
        <div class="header-search-box">
          <input type="text" id="header-search-input" class="header-search-input" placeholder="搜索关联词或机场..." aria-label="搜索关联词" autocomplete="off">
          <button id="header-search-btn" class="header-search-btn" title="点击搜索关联词" type="button">
            <svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>
          <div id="search-suggestions-dropdown" class="search-suggestions-dropdown" style="display: none;"></div>
        </div>

        <script>
          document.addEventListener('DOMContentLoaded', function() {
            const searchInput = document.getElementById('header-search-input');
            const searchBtn = document.getElementById('header-search-btn');
            const dropdown = document.getElementById('search-suggestions-dropdown');

            if (!searchInput || !dropdown) return;

            const staticSearchItems = [
              { title: "2026 稳定机场推荐总榜", keywords: ["机场推荐", "推荐", "2026", "稳定机场", "排行榜", "节点"], url: "/recommendations/", tag: "推荐榜单" },
              { title: "高性价比平价机场推荐", keywords: ["性价比", "平价", "便宜", "学生", "低价"], url: "/recommendations/value/", tag: "推荐榜单" },
              { title: "Clash 专用高速机场推荐", keywords: ["clash", "clash verge", "clash meta", "clash机场"], url: "/recommendations/clash/", tag: "推荐榜单" },
              { title: "灵动云 (4K极速 IPLC专线机场)", keywords: ["灵动云", "iplc", "专线", "灵动", "4k"], url: "/providers/lingdong-cloud/", tag: "机场评测" },
              { title: "暮光网络 (多节点全专线机场)", keywords: ["暮光网络", "暮光", "专线", "bgp"], url: "/providers/twilight/", tag: "机场评测" },
              { title: "飞猫云 (海量节点大流量机场)", keywords: ["飞猫云", "飞猫", "流量", "节点"], url: "/providers/flycat-cloud/", tag: "机场评测" },
              { title: "微风网络 (平价稳定备用机场)", keywords: ["微风网络", "微风", "便宜", "备用"], url: "/providers/breezenet/", tag: "机场评测" },
              { title: "极客云 (老牌稳定机场)", keywords: ["极客云", "极客", "老牌"], url: "/providers/jike/", tag: "机场评测" },
              { title: "新手选机场避坑指南", keywords: ["新手", "选机场", "指南", "避坑", "教程"], url: "/guide/2026-stable-airport-guide/", tag: "教程" },
              { title: "全平台客户端配置教程", keywords: ["客户端", "配置", "小火箭", "shadowrocket", "sing-box", "v2ray"], url: "/clients/clash-verge-rev-tutorial/", tag: "教程" },
              { title: "场景专线评测 (IEPL/IPLC)", keywords: ["iepl", "iplc", "专线", "游戏", "延迟"], url: "/scenarios/streaming-media-unlock/", tag: "评测" },
              { title: "常见问题解答与排错 FAQ", keywords: ["常见问题", "faq", "排错", "掉线", "超时", "chatgpt", "netflix"], url: "/faq/", tag: "FAQ" },
              { title: "机场节点服务状态与实时监测", keywords: ["服务状态", "状态", "监测", "在线"], url: "/status/", tag: "工具" }
            ];

            const dynamicSitePages = [
              {{ range .Site.RegularPages }}
              { title: {{ .Title | plainify }}, url: {{ .RelPermalink }}, summary: {{ .Summary | plainify | truncate 80 }}, section: {{ .Section }} },
              {{ end }}
            ];

            function getTagForSection(section) {
              if (section === 'providers') return '机场评测';
              if (section === 'clients') return '客户端配置';
              if (section === 'faq') return 'FAQ排错';
              if (section === 'guide') return '选型指南';
              if (section === 'recommendations') return '推荐榜单';
              if (section === 'scenarios') return '场景评测';
              return '全站页面';
            }

            function renderSuggestions(query) {
              const q = (query || '').trim().toLowerCase();
              dropdown.innerHTML = '';

              let results = [];

              if (!q) {
                results = staticSearchItems.slice(0, 6);
              } else {
                staticSearchItems.forEach(item => {
                  if (item.title.toLowerCase().includes(q) || item.keywords.some(k => k.toLowerCase().includes(q))) {
                    results.push(item);
                  }
                });

                dynamicSitePages.forEach(page => {
                  if (!page.title || !page.url) return;
                  if (results.some(r => r.url === page.url)) return;

                  const titleMatch = page.title.toLowerCase().includes(q);
                  const summaryMatch = page.summary && page.summary.toLowerCase().includes(q);

                  if (titleMatch || summaryMatch) {
                    results.push({
                      title: page.title,
                      url: page.url,
                      tag: getTagForSection(page.section),
                      keywords: [page.title]
                    });
                  }
                });
              }

              results = results.slice(0, 10);

              if (results.length === 0) {
                dropdown.innerHTML = '<div class="suggestion-empty">未找到关联结果，按 Enter 键全站搜索</div>';
              } else {
                const header = document.createElement('div');
                header.className = 'suggestion-group-title';
                header.textContent = !q ? '热门关联词与常用搜索' : '关联词与全站匹配结果 (' + results.length + ' 条)';
                dropdown.appendChild(header);

                results.forEach(item => {
                  const a = document.createElement('a');
                  a.href = item.url;
                  a.className = 'suggestion-item';
                  a.innerHTML = `<span class="item-title">${item.title}</span><span class="item-tag">${item.tag}</span>`;

                  function handleNavigate(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    window.location.href = item.url;
                  }

                  a.addEventListener('mousedown', handleNavigate);
                  a.addEventListener('click', handleNavigate);

                  dropdown.appendChild(a);
                });
              }
              dropdown.style.display = 'block';
            }

            searchInput.addEventListener('focus', function() {
              renderSuggestions(this.value);
            });

            searchInput.addEventListener('input', function() {
              renderSuggestions(this.value);
            });

            function performSearch() {
              const q = searchInput.value.trim();
              if (q) {
                const match = staticSearchItems.find(item => item.title.toLowerCase().includes(q.toLowerCase()) || item.keywords.some(k => k.toLowerCase() === q.toLowerCase())) ||
                              dynamicSitePages.find(p => p.title.toLowerCase().includes(q.toLowerCase()));
                if (match) {
                  window.location.href = match.url;
                } else {
                  window.location.href = '/faq/?q=' + encodeURIComponent(q);
                }
              } else {
                renderSuggestions('');
                searchInput.focus();
              }
            }

            if (searchBtn) {
              searchBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                performSearch();
              });
            }

            searchInput.addEventListener('keydown', function(e) {
              if (e.key === 'Enter') {
                e.preventDefault();
                performSearch();
              } else if (e.key === 'Escape') {
                dropdown.style.display = 'none';
              }
            });

            document.addEventListener('click', function(e) {
              if (!searchInput.contains(e.target) && !dropdown.contains(e.target) && (!searchBtn || !searchBtn.contains(e.target))) {
                dropdown.style.display = 'none';
              }
            });
          });
        </script>

        <!-- TG Channel Icon Button -->
        <a href="https://t.me/+6fo_zU8PHKVlMzZl" target="_blank" rel="noopener noreferrer" class="btn btn-social btn-tg" title="加入 TG 官方频道">
          <svg class="social-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm4.64 6.8c-.15 1.58-.8 5.42-1.13 7.19-.14.75-.42 1-.68 1.03-.58.05-1.02-.38-1.58-.75-.88-.58-1.38-.94-2.23-1.5-.99-.65-.35-1.01.22-1.59.15-.15 2.71-2.48 2.76-2.69.01-.03.01-.14-.07-.2-.08-.06-.19-.04-.27-.02-.12.03-1.96 1.25-5.54 3.69-.52.36-1 .54-1.43.53-.48-.01-1.4-.27-2.09-.49-.84-.28-1.51-.43-1.45-.91.03-.25.38-.51 1.07-.78 4.19-1.83 6.99-3.04 8.39-3.63 3.99-1.67 4.82-1.96 5.36-1.97.12 0 .38.03.55.17.14.12.18.28.2.45-.02.07-.02.21-.04.38z"/>
          </svg>
          <span>TG 频道</span>
        </a>

        <button id="mobile-menu-toggle" class="mobile-menu-btn" aria-label="切换导航菜单" aria-expanded="false" aria-controls="mobile-nav-menu">
          <span class="hamburger-icon"></span>
        </button>
      </div>
    </div>
  </div>

  <nav class="header-nav-bar" aria-label="主导航">
    <div class="header-container">
      <ul class="nav-list" id="desktop-nav-menu">
        {{ range $seo.navigationItems }}
        <li class="nav-item">
          <a href="{{ .url }}" class="nav-link{{ if eq $.RelPermalink .url }} active{{ end }}"{{ if eq $.RelPermalink .url }} aria-current="page"{{ end }}>
            {{ .label }}
          </a>
        </li>
        {{ end }}
      </ul>
    </div>
  </nav>

  <!-- Mobile Navigation Drawer -->
  <div id="mobile-nav-menu" class="mobile-nav-drawer" aria-hidden="true">
    <div class="mobile-drawer-header">
      <span class="mobile-brand-title">{{ .Site.Title }}</span>
      <button id="mobile-menu-close" class="close-btn" aria-label="关闭菜单">&times;</button>
    </div>
    <ul class="mobile-nav-list">
      {{ range $seo.navigationItems }}
      <li class="mobile-nav-item">
        <a href="{{ .url }}" class="mobile-nav-link{{ if eq $.RelPermalink .url }} active{{ end }}">
          {{ .label }}
        </a>
      </li>
      {{ end }}
    </ul>
    <div class="mobile-drawer-footer">
      <a href="/recommendations/" class="btn btn-primary btn-block">查看 2026 稳定机场推荐榜</a>
    </div>
  </div>
</header>
