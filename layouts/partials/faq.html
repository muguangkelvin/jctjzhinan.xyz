{{ if .Params.faq }}
<section class="section-faq-block">
  <h2 class="section-title">常见问题解答 (FAQ)</h2>
  <div class="faq-accordion">
    {{ range .Params.faq }}
    <details class="faq-item">
      <summary class="faq-question">
        <span class="q-icon">Q:</span>
        <span class="q-text">{{ .question }}</span>
      </summary>
      <div class="faq-answer">
        <p><span class="a-icon">A:</span> {{ .answer }}</p>
      </div>
    </details>
    {{ end }}
  </div>
</section>
{{ end }}
